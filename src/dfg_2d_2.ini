# DFG 2D-2 (Re = 100, periodic vortex shedding); evaluate max/min of c_D, c_L and the Strouhal number over the last
# periods of the CSV output.
[problem]
variant = 2d-2

[grid]
filename = dfg-cylinder-2d.msh
refinements = 0

[discretization]
velocity_order = 2
pressure_order = 1
eta = 16
upwind = 1

[timestepping]
scheme = fs-theta
dt = 0.01
t_end = 30
picard_tolerance = 1e-8
linear_solver = sparselu

[output]
csv = dfg_2d_2.csv
pressure = recovered
vtk_every = 0

[logging]
info = 0
