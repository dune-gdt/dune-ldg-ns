# DFG 2D-3 (U(t) = 1.5 sin(pi t / 8), t in [0, 8]); reference values: V. John, IJNMF 44 (2004) 777-788.
[problem]
variant = 2d-3

[grid]
filename = dfg-cylinder-2d.msh
refinements = 0

[discretization]
velocity_order = 2
pressure_order = 1
eta = 16
upwind = 1

[timestepping]
scheme = fs-theta
dt = 0.01
t_end = 8
picard_tolerance = 1e-8
linear_solver = sparselu

[output]
csv = dfg_2d_3.csv
pressure = recovered
vtk_every = 0

[logging]
info = 0
